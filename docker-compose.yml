services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ecologic_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    image: lesetool:latest
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      # Database
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: directus
      
      # Cache & Sessions
      CACHE_ENABLED: true
      CACHE_STORE: redis
      CACHE_TTL: 300  # 5 minutes cache (default might be too long)
      CACHE_AUTO_PURGE: true
      CACHE_NAMESPACE: directus_cache
      REDIS: redis://redis:6379
      SESSION_STORE: redis
      SESSION_REDIS: redis://redis:6379
      
      # Security
      KEY: 255d861b-5ea1-5996-9aa3-922530ec40b1
      SECRET: 6116487b-cda1-52c2-b5b5-c8022c45e263
      
      # Admin user (change these!)
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: d1r3ctu5
      
      # General
      PUBLIC_URL: http://localhost:8055
      LOG_LEVEL: info
      
      # Extensions
      EXTENSIONS_PATH: /directus/extensions
      
    volumes:
      - directus_uploads:/directus/uploads
      - directus_database:/directus/database
    depends_on:
      redis:
        condition: service_healthy
      #postgres:  
      #  condition: service_healthy
    networks:
      - ecologic_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  redis_data:
  directus_uploads:
  directus_database:

networks:
  ecologic_net:
    name: ecologic_net
    external: true
