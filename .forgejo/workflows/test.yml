name: Test Extensions

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-extensions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install root dependencies
      run: npm ci

    - name: Test extension builds
      run: |
        echo "Testing extension builds..."
        ./scripts/build-extensions.sh

    - name: Validate extensions
      run: |
        echo "Validating extensions..."
        for ext in extensions/*/; do
          if [ -f "$ext/package.json" ]; then
            echo "Validating $(basename $ext)..."
            cd "$ext"
            npm run validate || echo "Validation failed for $(basename $ext)"
            cd ../..
          fi
        done

  test-docker-build:
    runs-on: ubuntu-latest
    needs: test-extensions

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (test only)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: lesetool-directus:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        echo "Testing Docker image..."
        # Add health checks or basic container tests here
        docker run --rm lesetool-directus:test --help || true