version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-directus}
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-directus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tables_up.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./materialized_view.sql:/docker-entrypoint-initdb.d/02-views.sql
      - ./summary.sql:/docker-entrypoint-initdb.d/03-summary.sql
    networks:
      - directus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-directus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - directus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    # Image from Forgejo Container Registry
    # Format: {registry}/{owner}/{image}:{tag}
    image: ${FORGEJO_REGISTRY:-forgejo.yourcompany.com}/${FORGEJO_ORG:-your-org}/${IMAGE_NAME:-lesetool-directus}:${VERSION:-latest}
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"
    environment:
      # Database
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-directus}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:-directus}
      
      # Cache & Sessions
      CACHE_ENABLED: true
      CACHE_STORE: redis
      REDIS: redis://redis:6379
      SESSION_STORE: redis
      SESSION_REDIS: redis://redis:6379
      
      # Security
      KEY: ${KEY}
      SECRET: ${SECRET}
      
      # Admin user
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      
      # General
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Extensions
      EXTENSIONS_PATH: /directus/extensions
      
    volumes:
      - directus_uploads:/directus/uploads
      - directus_database:/directus/database
      - directus_extensions:/directus/extensions
    networks:
      - directus-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  directus-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  directus_uploads:
  directus_database:
  directus_extensions: